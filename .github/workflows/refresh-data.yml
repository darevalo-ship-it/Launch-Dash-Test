name: Refresh dashboard data

on:
  schedule:
    # 6:05am America/Los_Angeles year-round, after Daasity's overnight loads.
    # GitHub cron is UTC-only and DST-unaware, so both offsets are listed and
    # the "Check schedule window" step drops whichever one is out of season.
    # Deliberately off the top of the hour — GitHub delays scheduled runs
    # hardest at :00, and this workflow has been landing 1.5-2.75h late.
    - cron: '5 13 * * *' # 6:05am PDT (UTC-7)
    - cron: '5 14 * * *' # 6:05am PST (UTC-8)
  workflow_dispatch:
    inputs:
      data_cutoff:
        description: >-
          Last COMPLETE day to report (YYYY-MM-DD). Leave blank on the 6:05am
          PT schedule. Set it on manual runs after ~5pm PT: the runner's clock
          is UTC, so it has already rolled to tomorrow and the default cutoff
          (today - 1) picks up a partial Los Angeles day and labels it complete.
        required: false
        type: string
      force_digest:
        description: >-
          Post the full weekly digest instead of only what changed. The digest
          normally fires on Mondays; set this to send one on demand, e.g. after
          a change to the alert rules.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Keeps the refresh on Los Angeles time without maintaining two
      # workflows: both DST offsets are scheduled above, and the out-of-season
      # one exits here. Every later step already gates on steps.creds, so
      # skipping the creds step below skips the whole refresh.
      - name: Check schedule window
        id: window
        env:
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          # Match the cron expression that fired, NOT the current clock time.
          # GitHub can start a scheduled run hours after its slot, so an
          # "is it 6am in LA right now?" check would discard late runs — which
          # is most of them.
          if [ "$(TZ=America/Los_Angeles date +%z)" = "-0700" ]; then
            want='5 13 * * *' # PDT
          else
            want='5 14 * * *' # PST
          fi
          if [ -n "$FIRED_CRON" ] && [ "$FIRED_CRON" != "$want" ]; then
            echo "Cron '$FIRED_CRON' belongs to the other DST offset (in season: '$want') — skipping."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Snowflake secrets
        id: creds
        if: steps.window.outputs.proceed == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Snowflake secrets not configured yet — skipping refresh. Add SNOWFLAKE_* repository secrets to activate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: pip install "snowflake-connector-python[secure-local-storage]" cryptography

      # Asana is the team's source of truth for launch dates. Runs before the
      # Snowflake refresh so the snapshot it writes is picked up in the same
      # run. No-ops without ASANA_TOKEN, leaving the committed snapshot in
      # place, so a missing secret degrades instead of failing the refresh.
      - name: Sync launch calendar from Asana
        if: steps.creds.outputs.configured == 'true'
        # Belt and braces with the script's own soft failure: the calendar is
        # never worth failing the data refresh over.
        continue-on-error: true
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: python scripts/sync_launch_calendar.py

      # Demand Planning's decay-curve OOS and on-hand units, from the NPD OOS
      # Tracking sheet. Same shape as the Asana step above: runs before the
      # refresh so the snapshot it writes is picked up in the same run, and
      # no-ops without a credential rather than failing the refresh.
      - name: Sync Demand Planning OOS figures
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_npd_oos.py

      - name: Regenerate data.js from Snowflake
        if: steps.creds.outputs.configured == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          DATA_CUTOFF: ${{ inputs.data_cutoff }}
        run: python scripts/refresh_data.py

      # Runs after the refresh so it alerts on the data that just landed, and
      # after the commit step below would be too late to include its state
      # file. No-ops without SLACK_WEBHOOK_URL, and never fails the refresh —
      # a missed Slack post is a much smaller problem than no data.
      - name: Post launch alerts to Slack
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERT_LIMIT: ${{ vars.SLACK_ALERT_LIMIT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scripts/post_slack_alerts.py ${{ inputs.force_digest && '--digest' || '' }}

      - name: Commit and push if data changed
        if: steps.creds.outputs.configured == 'true'
        run: |
          # config/alert_state.json only exists once the Slack alert has posted
          # for the first time, so each path is added only if it is there —
          # `git add` on a missing pathspec fails the step.
          TRACKED=""
          for f in data.js config/launch_calendar.json config/npd_oos_tracking.json config/alert_state.json; do
            [ -e "$f" ] && TRACKED="$TRACKED $f"
          done
          git add --intent-to-add $TRACKED
          if git diff --quiet -- $TRACKED; then
            echo "Nothing changed in$TRACKED — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "chore: refresh dashboard data ($(date -u +%F))"
          git push
